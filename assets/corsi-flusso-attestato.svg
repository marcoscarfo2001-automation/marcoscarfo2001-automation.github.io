<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
<style>
.t{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;fill:#ece8df;text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
